name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Generated files up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build packs
        run: python3 scripts/build.py
      - name: Fail if generated files are stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated files are out of date. Run 'python scripts/build.py' and commit the result."
            exit 1
          fi

  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run 'go fmt ./...' in cli/: $unformatted"
            exit 1
          fi
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o anthropica-ci .
      - name: Smoke test
        run: ./anthropica-ci version && ./anthropica-ci skills list --repo .. | tail -1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm package smoke test
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) plat=win32-x64; dir=anthropica_windows_amd64; exe=anthropica.exe ;;
            Linux)   plat=linux-x64; dir=anthropica_linux_amd64;   exe=anthropica ;;
          esac
          bins="$RUNNER_TEMP/npm-bins"; packs="$RUNNER_TEMP/npm-packs"; prefix="$RUNNER_TEMP/npm-prefix"
          mkdir -p "$bins/$dir" "$packs"
          go build -ldflags "-X github.com/jamal-gml/anthropica/cli/internal/cli.version=0.0.0-ci" -o "$bins/$dir/$exe" .
          node ../scripts/npm/build.mjs --version 0.0.0-ci --binaries "$bins" --platforms "$plat"
          (cd ../npm/dist/anthropica && npm pack --pack-destination "$packs")
          (cd "../npm/dist/anthropica-$plat" && npm pack --pack-destination "$packs")
          # --omit=optional: the CI-only version is not on the registry; the platform tarball is installed explicitly.
          npm install -g --prefix "$prefix" --omit=optional --no-audit --no-fund \
            "$packs/anthropica-0.0.0-ci.tgz" "$packs/anthropica-$plat-0.0.0-ci.tgz"
          if [ "$RUNNER_OS" = Windows ]; then cmd="$prefix/anthropica.cmd"; else cmd="$prefix/bin/anthropica"; fi
          out="$("$cmd" version)"; echo "$out"
          case "$out" in *0.0.0-ci*) ;; *) echo "::error::unexpected version output"; exit 1 ;; esac
          if "$cmd" bogus; then echo "::error::invalid command should fail"; exit 1; fi
