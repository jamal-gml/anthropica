name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches packs.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("packs.json"))["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match packs.json version $version"
            exit 1
          fi
      - name: Build packs and release ZIPs
        run: python3 scripts/build.py --packs
      - name: Fail if committed generated files are stale
        run: |
          if [ -n "$(git status --porcelain -- plugins .claude-plugin dist/claude-ai-skills README.md)" ]; then
            echo "::error::Generated files on this tag are out of date."
            exit 1
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build CLI binaries
        working-directory: cli
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go test ./...
          out="$GITHUB_WORKSPACE/dist/cli"
          mkdir -p "$out"
          ldflags="-s -w -X github.com/jamal-gml/anthropica/cli/internal/cli.version=${TAG#v}"
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            # Version-free names keep releases/latest/download/<file> links stable.
            name="anthropica_${os}_${arch}"
            bin="anthropica"; [ "$os" = windows ] && bin="anthropica.exe"
            mkdir -p "build/$name"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "build/$name/$bin" .
            cp README.md ../LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "$out/$name.zip" "$name")
            else
              tar -czf "$out/$name.tar.gz" -C build "$name"
            fi
          done
          (cd "$out" && sha256sum * > checksums.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/packs/*.zip dist/claude-ai-skills/*.zip dist/cli/*
      - name: Tag CLI module for go install
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Go resolves github.com/jamal-gml/anthropica/cli@latest from cli/vX.Y.Z tags.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/cli/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
          echo "Created tag cli/${TAG}"
